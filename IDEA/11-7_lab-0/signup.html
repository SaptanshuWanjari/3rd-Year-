<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RBU Nagpur</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-900 text-white">
    <main class="min-h-screen p-3 sm:p-4 lg:p-6">
      <aside
        class="w-full bg-black/65 px-6 py-8 sm:px-8 lg:w-[360px] lg:px-8 lg:py-10 xl:w-[390px]"
      >
        <div class="mx-auto flex h-full max-w-[320px] flex-col">
          <h2
            class="text-2xl font-bold leading-tight text-white sm:text-[1.7rem]"
          >
            Welcome! Please login to continue.
          </h2>

          <div class="mt-8 space-y-4">
            <div
              class="overflow-hidden rounded-sm border border-black/10 bg-amber-100"
            >
              <input
                type="email"
                placeholder="24wanjaris@rbunagpur.in"
                aria-label="Email"
                readonly
                class="h-11 w-full bg-transparent px-4 text-[1rem] text-black outline-none"
              />
            </div>

            <div
              class="flex overflow-hidden rounded-sm border border-black/10 bg-amber-100"
            >
              <input
                type="password"
                placeholder="password123"
                aria-label="Password"
                readonly
                class="h-11 min-w-0 flex-1 bg-transparent px-4 text-[1rem] text-black outline-none"
              />
              <div
                class="flex h-11 w-14 items-center justify-center border-l border-black/10 bg-white/70 text-lg text-slate-600"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-eye-icon lucide-eye"
                >
                  <path
                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </div>
            </div>

            <button
              type="button"
              class="h-11 w-full rounded-sm bg-blue-600 text-lg font-medium text-white"
            >
              Login
            </button>
          </div>

          <a href="#" class="mt-8 text-base text-white/90 hover:text-white">
            Forgot password?
          </a>
          <a
            href="signup.html"
            class="mt-2 text-base text-white/90 hover:text-white"
          >
            New user? Sign up here
          </a>

          <div
            class="mt-auto space-y-2 pt-10 text-center text-sm text-white/95 sm:text-[0.95rem]"
          >
            <a href="#" class="block hover:text-white"
              >Applicant Employee Registration</a
            >
            <a href="#" class="block hover:text-white">Alumni Registration</a>
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>
